<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Enterprise Knowledge Assistant</title>
    <style>body {
        font-family: Arial;
        margin: 40px;
        max-width: 1000px
    }

    textarea {
        width: 100%;
        height: 90px
    }

    button {
        padding: 10px 18px;
        margin-top: 10px
    }

    .grid {
        display: grid;
        grid-template-columns:1fr 1fr;
        gap: 15px
    }

    pre {
        white-space: pre-wrap;
        background: #f5f5f5;
        padding: 15px
    }

    .source {
        border-left: 4px solid #555;
        padding: 8px;
        margin: 5px 0
    }</style>
</head>
<body><h1>Enterprise Knowledge Assistant</h1>
<p>Spring Boot + Spring AI + local Ollama • ACL + effective-date aware RAG</p><textarea id="q"
                                                                                        placeholder="Ask: How long are transaction records retained?"></textarea>
<div class="grid"><label>Access groups<br><input id="a" value="EMPLOYEE" style="width:100%"></label><label>Effective
    date<br><input id="d" type="date" value="2026-06-01" style="width:100%"></label></div>
<button onclick="ask()">Ask</button>
<h3>Answer</h3>
<pre id="ans">Waiting...</pre>
<h3>Sources</h3>
<div id="src"></div>
<script>async function ask() {
    const q = document.getElementById('q').value;
    const groups = document.getElementById('a').value.split(',').map(x => x.trim()).filter(Boolean);
    const effectiveDate = document.getElementById('d').value || null;
    const r = await fetch('/api/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: q, userAccess: groups, effectiveDate})
    });
    const x = await r.json();
    document.getElementById('ans').textContent = '[' + x.status + '] ' + x.answer + '\n\n' + x.retrievalSummary;
    document.getElementById('src').innerHTML = (x.sources || []).map(s => `<div class="source"><b>${s.id}</b> — ${s.title} — v${s.version} — effective ${s.effectiveFrom}</div>`).join('')
}</script>
</body>
</html>
